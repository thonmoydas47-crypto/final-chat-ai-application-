<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chat</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bot-container">
      <header class="bot-header">
        <div class="hospital-logo">
          <div class="logo-icon"></div>
          <div>
            <span>DASSAI MEDICAL</span>
            <div style="font-size: 0.85rem; color: #94a3b8; margin-top: 4px;">Made by Thonmoy Das Aviation HS (Final AI project)</div>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
          <div class="ai-status-dot"></div>
          <small style="color: #64748b;">AI System Active</small>
        </div>
      </header>

      <main class="chat-window">
        <div class="chat-messages" id="messages">
          <div class="message message-ai">
            <div class="message-bubble">
              Hi! Ask me anything to get started.
            </div>
          </div>
        </div>
      </main>

      <footer class="input-area">
        <div class="input-wrapper">
          <form class="composer" id="composer" autocomplete="off" style="display: flex; width: 100%; gap: 12px; align-items: center;">
            <input
              class="composer-input"
              id="composer-input"
              type="text"
              placeholder="Describe your symptoms..."
              required
              style="flex: 1; border: none; outline: none; font-size: 16px; background: transparent;"
            />
            <button class="composer-send" id="composer-send" type="submit">
              Send
            </button>
          </form>
        </div>
      </footer>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
