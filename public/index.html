<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dassai Medical AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="main-header">
      <div class="logo-area">
        <span class="plus-icon">✚</span>
        <div>
          <h1>DASSAI MEDICAL</h1>
          <p class="subtitle">Made by Thonmoy Das Aviation HS (Final AI project)</p>
        </div>
      </div>
      <div class="system-status">
        <span class="status-dot"></span>
        AI System Active
      </div>
    </header>

    <main class="chat-wrapper">
      <div class="chat-stream" id="messages">
        <div class="message ai-message is-streaming">
          <div class="message-bubble">Hi! Ask me anything to get started.</div>
        </div>
      </div>
    </main>

    <footer class="input-container">
      <form class="input-box-wrapper composer" id="composer" autocomplete="off">
        <input
          type="text"
          placeholder="Describe your symptoms..."
          id="composer-input"
          class="composer-input"
          required
        />
        <button class="input-send composer-send" id="composer-send" type="submit" aria-label="Send message">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 21L23 12L2 3V10L17 12L2 14V21Z" fill="currentColor" />
          </svg>
        </button>
      </form>
    </footer>

    <script type="module" src="app.js"></script>
  </body>
</html>
